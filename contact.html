<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Q.Lab Coffee</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="stylesheet" href="stylish.css">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="contact">

    <div class="btnx">
        <a href="index.html" class="btn">
            <span>Go Back to Home</span>
            <i class='bx bx-left-arrow-alt'></i>
        </a>
    </div>

    <main class="contact-section">
        <div class="container">
            <h1>Contact Us For Online Order</h1>
            <p class="subtext">We would love to respond to your requests. Feel free to get in touch with us!</p>

            <div class="contact-box">
                <!-- Left Form Column -->
                <div class="contact-left">
                    <h3>Send your request</h3>
                    <form class="contact-form" id="contactForm" onsubmit="event.preventDefault(); alert('Thank you! Your message has been received.'); this.reset();">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="name">Name:</label>
                                <input type="text" id="name" placeholder="Simon Riley" required>
                            </div>
                            <div class="input-group">
                                <label for="phone">Phone:</label>
                                <input type="tel" id="phone" placeholder="+90 530 701 4423">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" placeholder="example@gmail.com" required>
                            </div>
                            <div class="input-group">
                                <label for="subject">Subject:</label>
                                <input type="text" id="subject" placeholder="Product Demo">
                            </div>
                        </div>

                        <label for="message">Message:</label>
                        <textarea id="message" rows="4" placeholder="Your Message" required></textarea>

                        <button type="submit">SEND</button>

                        <div class="video-wrapper">
                            <iframe 
                                src="https://www.youtube.com/embed/4Mzgb0GzL18?si=ZM2g_o-kmfveIojc" 
                                title="YouTube video player" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </form>
                </div>

                <!-- Right Info Column -->
                <div class="contact-right">
                    <h3>Reach Us</h3>

                    <table class="contact-info-table">
                        <tr>
                            <td>Email:</td>
                            <td>contactus@example.com</td>
                        </tr>
                        <tr>
                            <td>Phone:</td>
                            <td>+90 212 324 0096</td>
                        </tr>
                        <tr>
                            <td>Address:</td>
                            <td>Orhantepe, Sahilyolu Cd. No:19/1, 34865 Kartal/İstanbul</td>
                        </tr>
                    </table>

                    <div class="map-wrapper">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2508.5531154723544!2d-114.09509571028615!3d51.042873971601495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53716f61937b92df%3A0xee4f1465c2570eb7!2sQ.Lab%20Coffee%20Roasters%20%26%20Tasting%20Experience!5e0!3m2!1str!2str!4v1705629506793!5m2!1str!2str" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
