<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="stylish.css">
    <!-- box icons-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
</head>
<body class="contact">

    <div class="btnx">
        <a href="project.html" class="btn">
        <!-- link to contact page-->
       <span>Go Back to Main Page </span>
       <i class='bx bx-left-arrow-alt bx-burst bx-rotate-90' ></i>
   </a>
</div>
    <div class="container">
        <h1>Contact Us For Online Order</h1>
        <p>We would love to respond your requests. <br>
            Feel free to get in touch with us!</p>
        <div class="contact-box">
            <div class="contact-left">
                <h3>Sent your request</h3>
                <form>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Name:</label>
                            <input type="text" placeholder="Simon Riley">
                        </div>
                        <div class="input-group">
                            <label>Phone:</label>
                            <input type="text" placeholder="+90 530 701 4423">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Email:</label>
                            <input type="email" placeholder="example@gmail.com">
                        </div>
                        <div class="input-group">
                            <label>Subject:</label>
                            <input type="text" placeholder="Product Demo">
                        </div>
                    </div>

                    <label>Message:</label>
                    <textarea rows="5" placeholder="Your Message"></textarea>

                    <button type="submit">SEND</button>
                    <p><br><iframe width="560" height="315" src="https://www.youtube.com/embed/4Mzgb0GzL18?si=ZM2g_o-kmfveIojc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></p>
                </form>
            </div>
            <div class="contact-right">
                <h3>Reach us</h3>

                <table>
                    <tr>
                        <td>Email:</td>
                        <td>contactus@example.com</td>
                    </tr>
                    <tr>
                        <td>Phone:</td>
                        <td>+90 212 324 0096</td>
                    </tr>
                    <tr>
                        <td>Address:</td>
                        <td>Orhantepe, Sahilyolu Cd. No:19/1, 34865 Kartal/İstanbul</br></td>
                        <p><iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2508.5531154723544!2d-114.09509571028615!3d51.042873971601495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53716f61937b92df%3A0xee4f1465c2570eb7!2sQ.Lab%20Coffee%20Roasters%20%26%20Tasting%20Experience!5e0!3m2!1str!2str!4v1705629506793!5m2!1str!2str" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></p>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    
</body>
</html>
